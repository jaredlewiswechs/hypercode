<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HyperCode IDE</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='50,5 95,50 50,95 5,50' fill='%2358a6ff'/></svg>">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface-bright: #1c2128;
      --border: #30363d;
      --text: #e6edf3;
      --text-dim: #8b949e;
      --text-dimmer: #484f58;
      --accent: #58a6ff;
      --green: #3fb950;
      --green-dim: #238636;
      --red: #f85149;
      --orange: #d29922;
      --purple: #bc8cff;
      --cyan: #79c0ff;
      --header-h: 52px;
      --footer-h: 30px;
      --pane-header-h: 38px;
      --radius: 6px;
      --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', 'Menlo', 'Consolas', monospace;
      --transition: 150ms ease;
    }

    html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }

    /* ── Header ── */
    header {
      height: var(--header-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; gap: 12px;
    }
    .brand { display: flex; align-items: center; gap: 10px; user-select: none; }
    .brand svg { width: 22px; height: 22px; flex-shrink: 0; }
    .brand-name { font-weight: 700; font-size: 16px; letter-spacing: -0.3px; }
    .brand-badge {
      font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px;
      background: rgba(88,166,255,0.15); color: var(--accent); padding: 2px 7px; border-radius: 4px;
    }
    .controls { display: flex; align-items: center; gap: 8px; }
    select {
      background: var(--surface-bright); color: var(--text); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 7px 14px; font-size: 13px; cursor: pointer; outline: none;
      transition: border-color var(--transition);
    }
    select:hover { border-color: var(--text-dim); }
    select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(88,166,255,0.12); }
    button {
      border: 1px solid transparent; border-radius: var(--radius); padding: 7px 18px;
      font-size: 13px; font-weight: 600; cursor: pointer; transition: all var(--transition);
      display: flex; align-items: center; gap: 6px; font-family: inherit;
    }
    .btn-run { background: var(--green-dim); color: #fff; border-color: rgba(63,185,80,0.4); }
    .btn-run:hover { background: var(--green); }
    .btn-run:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-run:disabled:hover { background: var(--green-dim); }
    .btn-clear { background: transparent; color: var(--text-dim); border-color: var(--border); }
    .btn-clear:hover { color: var(--text); border-color: var(--text-dim); }
    .shortcut-hint {
      font-size: 11px; color: var(--text-dimmer); font-family: var(--font-mono);
      background: var(--surface-bright); padding: 3px 8px; border-radius: 4px;
      border: 1px solid var(--border);
    }

    /* ── Main Layout ── */
    main {
      display: flex;
      height: calc(100% - var(--header-h) - var(--footer-h));
    }
    .pane { display: flex; flex-direction: column; overflow: hidden; }
    .editor-pane { flex: 1; min-width: 0; border-right: 1px solid var(--border); }
    .output-pane { width: 40%; min-width: 280px; }
    .pane-header {
      height: var(--pane-header-h);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px;
      font-size: 11px; font-weight: 600; color: var(--text-dim);
      text-transform: uppercase; letter-spacing: 0.8px;
      background: var(--surface); border-bottom: 1px solid var(--border); user-select: none;
    }
    .pane-header .file-ext { color: var(--text-dimmer); font-weight: 400; }

    /* ── Editor ── */
    .editor-wrap { flex: 1; overflow: hidden; }

    /* ── Output ── */
    .output-content {
      flex: 1; overflow-y: auto; padding: 14px 18px;
      font-family: var(--font-mono); font-size: 13px; line-height: 1.75;
    }
    .output-line { white-space: pre-wrap; word-break: break-word; animation: fadeIn 80ms ease; }
    .output-line.error { color: var(--red); }
    .output-line.prompt { color: var(--orange); }
    .output-line.user-input { color: var(--accent); }
    .output-line.success { color: var(--green); }
    .output-line.info { color: var(--text-dim); }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; transform: translateY(0); } }

    .empty-state {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; gap: 12px; color: var(--text-dimmer); user-select: none;
    }
    .empty-state .icon { font-size: 36px; opacity: 0.3; }
    .empty-state p { font-size: 13px; }
    .empty-state .hint { font-size: 11px; opacity: 0.6; }

    .ask-container { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
    .ask-marker { color: var(--accent); font-weight: 700; flex-shrink: 0; }
    .ask-input {
      flex: 1; background: transparent; border: none; border-bottom: 2px solid var(--accent);
      color: var(--text); font-family: var(--font-mono); font-size: 13px;
      padding: 4px 0; outline: none; caret-color: var(--accent);
    }
    .ask-input::placeholder { color: var(--text-dimmer); }

    /* ── Footer ── */
    footer {
      height: var(--footer-h);
      background: var(--surface); border-top: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; font-size: 11px; color: var(--text-dim);
    }
    .status-dot {
      display: inline-block; width: 7px; height: 7px; border-radius: 50%;
      margin-right: 6px; background: var(--green); vertical-align: middle;
    }
    .status-dot.running { background: var(--orange); animation: pulse 1s ease infinite; }
    .status-dot.error { background: var(--red); }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    /* ── Resizer ── */
    .resizer {
      width: 4px; cursor: col-resize; background: transparent;
      transition: background var(--transition); position: relative; z-index: 10; margin: 0 -2px;
    }
    .resizer:hover, .resizer.active { background: var(--accent); }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-dimmer); }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polygon points="50,8 92,50 50,92 8,50" fill="#58a6ff" opacity="0.9"/>
        <polygon points="50,22 78,50 50,78 22,50" fill="#0d1117" opacity="0.6"/>
        <polygon points="50,34 66,50 50,66 34,50" fill="#58a6ff"/>
      </svg>
      <span class="brand-name">HyperCode</span>
      <span class="brand-badge">IDE</span>
    </div>
    <div class="controls">
      <select id="examples">
        <option value="">Load Example...</option>
        <option value="hello">Hello World</option>
        <option value="fizzbuzz">FizzBuzz</option>
        <option value="lists">List Operations</option>
        <option value="classroom">Classroom (OOP)</option>
        <option value="quiz">Quiz Game</option>
      </select>
      <button class="btn-run" id="runBtn" title="Run code">
        <span id="runIcon">&#9654;</span>
        <span id="runLabel">Run</span>
      </button>
      <button class="btn-clear" id="clearBtn" title="Clear output">Clear</button>
      <span class="shortcut-hint" id="shortcutHint"></span>
    </div>
  </header>

  <main>
    <div class="pane editor-pane">
      <div class="pane-header">
        <span>Editor</span>
        <span class="file-ext">.say</span>
      </div>
      <div class="editor-wrap" id="editorWrap"></div>
    </div>
    <div class="resizer" id="resizer"></div>
    <div class="pane output-pane" id="outputPane">
      <div class="pane-header"><span>Output</span></div>
      <div class="output-content" id="output">
        <div class="empty-state" id="emptyState">
          <div class="icon">&#9654;</div>
          <p>Run your code to see output here</p>
          <p class="hint" id="emptyHint"></p>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div>
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Ready</span>
    </div>
    <span id="position">Ln 1, Col 1</span>
  </footer>

  <script src="say.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>
  <script>
    // ── Examples ──
    const EXAMPLES = {
      hello:
`-- Hello World
-- A simple greeting program

put ask What is your name into name
show Hello .name, welcome to HyperCode!`,

      fizzbuzz:
`-- FizzBuzz
-- The classic challenge

for each n in 1 to 30
  if n % 15 == 0
    show FizzBuzz
  else if n % 3 == 0
    show Fizz
  else if n % 5 == 0
    show Buzz
  else
    show .n
  end
end`,

      lists:
`-- List Operations
-- Working with collections

put list 5, 3, 8, 1, 9, 2, 7 into numbers
show Original .numbers

sort numbers
show Sorted .numbers

reverse numbers
show Reversed .numbers

show
show Count (.numbers.count)
show Sum (.numbers.sum)
show Min (.numbers.min)
show Max (.numbers.max)

set big to numbers where it > 4
show
show Bigger than 4 .big
show That is (.big.count) numbers`,

      classroom:
`-- Classroom
-- Object-oriented programming with Kinds

kind Student
  name is Unknown
  grade is 0

  on passing
    return me.grade >= 70
  end

  on report
    if send passing to me
      show .me.name scored .me.grade and is passing
    else
      show .me.name scored .me.grade and needs help
    end
  end
end

make a Student called alice with name Alice, grade 95
make a Student called bob with name Bob, grade 60
make a Student called charlie with name Charlie, grade 82

put list alice, bob, charlie into students

show Class Report
for each s in students
  send report to s
end

set passing to students where send passing to it
show
show (.passing.count) out of (.students.count) students passing`,

      quiz:
`-- Quiz Game
-- Interactive trivia with score tracking

kind Question
  text is Empty
  answer is Empty

  on check guess
    if guess == me.answer
      show Correct!
      return true
    else
      show Wrong. The answer was .me.answer
      return false
    end
  end
end

set score to 0
set total to 0

put list into questions
  make a Question with text What planet is closest to the sun, answer Mercury
  make a Question with text What language is this, answer HyperCode
  make a Question with text How many legs does a spider have, answer 8
end

for each q in questions
  ask .q.text
  set guess to it
  set total to total + 1
  if send check guess to q
    set score to score + 1
  end
end

show You got .score out of .total`,
    };

    const DEFAULT_CODE =
`-- Welcome to HyperCode!
-- Select an example above, or write your own

show Hello, World!
`;

    // ── Detect platform ──
    const isMac = navigator.platform.toUpperCase().indexOf('MAC') >= 0;
    document.getElementById('shortcutHint').textContent = isMac ? '\u2318\u21B5' : 'Ctrl+\u21B5';
    document.getElementById('emptyHint').textContent = `Press ${isMac ? '\u2318' : 'Ctrl+'}Enter or click Run`;

    // ── Load Monaco ──
    require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs' } });

    require(['vs/editor/editor.main'], function () {
      // ── Register HyperCode language ──
      monaco.languages.register({ id: 'hypercode', extensions: ['.say'] });

      monaco.languages.setMonarchTokensProvider('hypercode', {
        defaultToken: '',
        ignoreCase: true,

        // Keywords grouped by role — synced with src/tokens.ts KEYWORDS map
        actions: [
          'into', 'set', 'make', 'send', 'add', 'remove',
          'go', 'open', 'hide', 'draw', 'wait', 'play', 'clear', 'stop', 'return',
          'use', 'grab', 'sort', 'reverse', 'shuffle', 'read', 'write', 'append',
          'fetch', 'serve', 'respond', 'route', 'remember', 'recall', 'forget',
          'think', 'explain', 'listen', 'emit', 'connect', 'stream',
          'animate', 'forward', 'backward', 'turn', 'pen', 'switch', 'cookie',
          'allow', 'share', 'snapshot',
          // Missing actions added:
          'request', 'submit', 'collect', 'load', 'save', 'execute', 'apply',
          'fill', 'stroke', 'debug', 'visualize', 'lint', 'watch', 'profile',
        ],
        control: [
          'if', 'else', 'repeat', 'times', 'while', 'until', 'forever',
          'for', 'each', 'in', 'to', 'at', 'by', 'as', 'when', 'is',
          'try', 'or', 'catch', 'do', 'together', 'every', 'scene',
          // Missing control keywords added:
          'await', 'second', 'seconds', 'timer',
        ],
        structure: [
          'kind', 'from', 'on', 'me', 'end', 'command', 'template', 'contract',
          'implements', 'secret', 'static', 'test', 'check', 'mock', 'before',
          'after', 'benchmark', 'enum',
          // Missing structure keywords added:
          'uses', 'getter', 'overload', 'property', 'namespace', 'classroom',
        ],
        connectors: [
          'a', 'called', 'with', 'it', 'not', 'and', 'greater', 'less', 'than',
          'new', 'where', 'contains',
          'random', 'pick', 'rounded', 'unique', 'pair', 'exists', 'matches',
          'format', 'places', 'curry', 'compose', 'csv', 'json', 'env',
          'current', 'today', 'left', 'right', 'up', 'down',
          // Missing connectors added:
          'clicked', 'pressed', 'changed', 'key', 'aloud', 'note', 'sound',
          'canvas', 'color', 'size', 'line', 'circle', 'rectangle', 'width', 'height',
          'step', 'breakpoint', 'moving', 'over', 'sprite', 'touches', 'layer',
          'socket', 'session', 'client', 'status',
          'any', 'arguments', 'files', 'folder', 'shell',
          'challenge', 'grade', 'rubric', 'history',
        ],
        typeKeywords: ['text', 'number', 'boolean', 'date', 'time', 'list', 'map', 'lambda'],
        atoms: ['true', 'false', 'nothing'],

        operators: [
          '+', '-', '*', '/', '%', '^', '==', '!=', '>', '<', '>=', '<=', '|>', '|', '->'
        ],

        tokenizer: {
          root: [
            // Multi-line comments ---
            [/---/, 'comment', '@multiComment'],
            // Single-line comments --
            [/--.*$/, 'comment'],

            // Triple-quoted strings
            [/"""/, 'string', '@tripleString'],
            // Double-quoted strings (with interpolation)
            [/"/, 'string', '@string'],

            // Dot-interpolation (.varName.path)
            [/\.[a-zA-Z_]\w*(?:\.[a-zA-Z_]\w*)*/, 'variable.interpolation'],

            // Numbers
            [/-?\d+(\.\d+)?/, 'number'],

            // Identifiers & keywords — show/ask/put get special line states
            [/[a-zA-Z_]\w*/, {
              cases: {
                'show': { token: 'keyword', next: '@showLine' },
                'ask': { token: 'keyword', next: '@showLine' },
                'put': { token: 'keyword', next: '@putLine' },
                '@atoms': 'constant',
                '@typeKeywords': 'type',
                '@actions': 'keyword',
                '@control': 'keyword.control',
                '@structure': 'keyword.structure',
                '@connectors': 'keyword.connector',
                '@default': { cases: { '[A-Z].*': 'type.identifier', '@default': 'identifier' } }
              }
            }],

            // Operators — != must come before the general comparison rule
            [/!=/, 'operator'],
            [/\|>?/, 'operator'],
            [/->/, 'operator'],
            [/[+\-*\/%\^]/, 'operator'],
            [/[><=]=?/, 'operator'],

            // Brackets
            [/[(){}[\]]/, '@brackets'],
            // Delimiters
            [/[,.:;]/, 'delimiter'],

            // Whitespace
            [/\s+/, 'white'],
          ],

          // After show/ask: rest of line is plain text with interpolation support
          showLine: [
            [/\.[a-zA-Z_]\w*(?:\.[a-zA-Z_]\w*)*/, 'variable.interpolation'],
            [/\(/, { token: '@brackets', next: '@showExpr' }],
            [/"/, 'string', '@string'],
            [/\s+/, 'white'],
            [/$/, { token: '', next: '@pop' }],
            [/[^\s.()"]+/, 'identifier'],
            [/./, 'identifier'],
          ],

          // Expression inside () in show/ask lines — normal highlighting
          showExpr: [
            [/\)/, { token: '@brackets', next: '@pop' }],
            [/\(/, { token: '@brackets', next: '@showExpr' }],
            [/"/, 'string', '@string'],
            [/\.[a-zA-Z_]\w*(?:\.[a-zA-Z_]\w*)*/, 'variable.interpolation'],
            [/-?\d+(\.\d+)?/, 'number'],
            [/[a-zA-Z_]\w*/, {
              cases: {
                '@atoms': 'constant',
                '@typeKeywords': 'type',
                '@actions': 'keyword',
                '@control': 'keyword.control',
                '@structure': 'keyword.structure',
                '@connectors': 'keyword.connector',
                '@default': { cases: { '[A-Z].*': 'type.identifier', '@default': 'identifier' } }
              }
            }],
            [/!=/, 'operator'],
            [/\|>?/, 'operator'],
            [/->/, 'operator'],
            [/[+\-*\/%\^]/, 'operator'],
            [/[><=]=?/, 'operator'],
            [/[{}[\]]/, '@brackets'],
            [/[,.:;]/, 'delimiter'],
            [/\s+/, 'white'],
          ],

          // After put: literal text until 'into', with special forms
          putLine: [
            [/\.[a-zA-Z_]\w*(?:\.[a-zA-Z_]\w*)*/, 'variable.interpolation'],
            [/"/, 'string', '@string'],
            [/-?\d+(\.\d+)?/, 'number'],
            [/[a-zA-Z_]\w*/, {
              cases: {
                'into': { token: 'keyword', next: '@pop' },
                'list': { token: 'type', next: '@pop' },
                'map': { token: 'type', next: '@pop' },
                'ask': { token: 'keyword', next: '@pop' },
                'pair': { token: 'keyword.connector', next: '@pop' },
                'unique': { token: 'keyword.connector', next: '@pop' },
                '@atoms': 'constant',
                '@default': 'identifier',
              }
            }],
            [/\s+/, 'white'],
            [/$/, { token: '', next: '@pop' }],
            [/./, 'identifier'],
          ],

          multiComment: [
            [/---/, 'comment', '@pop'],
            [/./, 'comment'],
            [/$/, 'comment'],
          ],

          tripleString: [
            [/"""/, 'string', '@pop'],
            [/\{[^}]*\}/, 'string.interpolation'],
            [/./, 'string'],
            [/$/, 'string'],
          ],

          string: [
            [/\\./, 'string.escape'],
            [/\{[^}]*\}/, 'string.interpolation'],
            [/"/, 'string', '@pop'],
            [/./, 'string'],
          ],
        },
      });

      // ── Define theme ──
      monaco.editor.defineTheme('hypercode-dark', {
        base: 'vs-dark',
        inherit: true,
        rules: [
          { token: 'comment', foreground: '484f58', fontStyle: 'italic' },
          { token: 'keyword', foreground: 'ff7b72', fontStyle: 'bold' },
          { token: 'keyword.control', foreground: 'ff7b72' },
          { token: 'keyword.structure', foreground: 'ff7b72' },
          { token: 'keyword.connector', foreground: 'ff7b72' },
          { token: 'constant', foreground: '79c0ff' },
          { token: 'type', foreground: '79c0ff' },
          { token: 'type.identifier', foreground: 'd2a8ff' },
          { token: 'number', foreground: 'bc8cff' },
          { token: 'string', foreground: 'a5d6ff' },
          { token: 'string.escape', foreground: '79c0ff' },
          { token: 'string.interpolation', foreground: '79c0ff', fontStyle: 'italic' },
          { token: 'variable.interpolation', foreground: 'ffa657' },
          { token: 'operator', foreground: 'ff7b72' },
          { token: 'delimiter', foreground: '8b949e' },
          { token: 'identifier', foreground: 'e6edf3' },
        ],
        colors: {
          'editor.background': '#0d1117',
          'editor.foreground': '#e6edf3',
          'editor.lineHighlightBackground': '#161b2280',
          'editor.selectionBackground': '#58a6ff30',
          'editorCursor.foreground': '#58a6ff',
          'editorLineNumber.foreground': '#484f58',
          'editorLineNumber.activeForeground': '#8b949e',
          'editorGutter.background': '#0d1117',
          'editor.selectionHighlightBackground': '#58a6ff20',
          'editorBracketMatch.background': '#58a6ff40',
          'editorBracketMatch.border': '#58a6ff60',
          'scrollbarSlider.background': '#30363d80',
          'scrollbarSlider.hoverBackground': '#484f58',
          'scrollbarSlider.activeBackground': '#8b949e',
        },
      });

      // ── Create editor ──
      const editor = monaco.editor.create(document.getElementById('editorWrap'), {
        value: DEFAULT_CODE,
        language: 'hypercode',
        theme: 'hypercode-dark',
        fontSize: 14,
        lineHeight: 24,
        fontFamily: "'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', 'Menlo', 'Consolas', monospace",
        minimap: { enabled: false },
        scrollBeyondLastLine: false,
        automaticLayout: false,
        tabSize: 2,
        insertSpaces: true,
        renderLineHighlight: 'line',
        matchBrackets: 'always',
        autoClosingBrackets: 'always',
        padding: { top: 12 },
        overviewRulerLanes: 0,
        hideCursorInOverviewRuler: true,
        overviewRulerBorder: false,
        scrollbar: { verticalScrollbarSize: 8, horizontalScrollbarSize: 8 },
      });

      // ── Run keybinding ──
      editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter, function () {
        runCode();
      });

      // ── Cursor position ──
      editor.onDidChangeCursorPosition(function (e) {
        document.getElementById('position').textContent =
          'Ln ' + e.position.lineNumber + ', Col ' + e.position.column;
      });

      // ── Error decoration support ──
      let errorDecorations = [];

      // ── DOM refs ──
      const outputEl = document.getElementById('output');
      const emptyState = document.getElementById('emptyState');
      const runBtn = document.getElementById('runBtn');
      const runIcon = document.getElementById('runIcon');
      const runLabel = document.getElementById('runLabel');
      const clearBtn = document.getElementById('clearBtn');
      const examplesSelect = document.getElementById('examples');
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');

      // ── State ──
      let isRunning = false;
      let currentReject = null;

      // ── Output helpers ──
      function clearOutput() {
        outputEl.innerHTML = '';
        emptyState.style.display = '';
        outputEl.appendChild(emptyState);
      }

      function hideEmpty() {
        if (emptyState.parentNode) emptyState.remove();
      }

      function appendLine(text, cls) {
        hideEmpty();
        const div = document.createElement('div');
        div.className = 'output-line' + (cls ? ' ' + cls : '');
        div.textContent = text;
        outputEl.appendChild(div);
        outputEl.scrollTop = outputEl.scrollHeight;
        return div;
      }

      // ── Run ──
      async function runCode() {
        if (isRunning) return;
        isRunning = true;
        runBtn.disabled = true;
        runIcon.textContent = '\u23F3';
        runLabel.textContent = 'Running';
        statusDot.className = 'status-dot running';
        statusText.textContent = 'Running...';

        // Clear error decorations
        errorDecorations = editor.deltaDecorations(errorDecorations, []);

        // Clear output
        outputEl.innerHTML = '';
        hideEmpty();

        const source = editor.getValue();
        const startTime = performance.now();

        try {
          const { Lexer, Parser, Interpreter } = HyperCode;
          const lexer = new Lexer(source);
          const tokens = lexer.tokenize();
          const parser = new Parser();
          const program = parser.parse(tokens);

          const interpreter = new Interpreter({
            output: function(text) {
              appendLine(text);
            },
            input: function(prompt) {
              return new Promise(function(resolve, reject) {
                currentReject = reject;
                appendLine('? ' + prompt, 'prompt');

                const container = document.createElement('div');
                container.className = 'ask-container';

                const marker = document.createElement('span');
                marker.className = 'ask-marker';
                marker.textContent = '\u276F';

                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'ask-input';
                input.placeholder = 'Type your answer...';
                input.autocomplete = 'off';

                input.addEventListener('keydown', function(e) {
                  if (e.key === 'Enter') {
                    var val = input.value;
                    container.remove();
                    appendLine('\u276F ' + val, 'user-input');
                    currentReject = null;
                    resolve(val);
                  }
                });

                container.appendChild(marker);
                container.appendChild(input);
                outputEl.appendChild(container);
                outputEl.scrollTop = outputEl.scrollHeight;
                input.focus();
              });
            },
            maxIterations: 100000
          });

          await interpreter.run(program);

          const elapsed = ((performance.now() - startTime) / 1000).toFixed(2);
          appendLine('', 'info');
          appendLine('\u2713 Finished in ' + elapsed + 's', 'success');
          statusDot.className = 'status-dot';
          statusText.textContent = 'Done in ' + elapsed + 's';

        } catch (err) {
          if (err && err.message === 'Aborted') {
            appendLine('\u2717 Stopped', 'info');
            statusDot.className = 'status-dot';
            statusText.textContent = 'Stopped';
          } else {
            appendLine('', 'info');
            appendLine('\u2717 Error: ' + (err.message || err), 'error');
            statusDot.className = 'status-dot error';
            statusText.textContent = 'Error';

            // Highlight error line
            if (err.line) {
              errorDecorations = editor.deltaDecorations([], [{
                range: new monaco.Range(err.line, 1, err.line, 1),
                options: {
                  isWholeLine: true,
                  className: 'error-line-decoration',
                  glyphMarginClassName: 'error-glyph',
                }
              }]);
              setTimeout(function () {
                errorDecorations = editor.deltaDecorations(errorDecorations, []);
              }, 3000);
            }
          }
        }

        isRunning = false;
        currentReject = null;
        runBtn.disabled = false;
        runIcon.textContent = '\u25B6';
        runLabel.textContent = 'Run';
      }

      // ── Event handlers ──
      runBtn.addEventListener('click', runCode);

      clearBtn.addEventListener('click', function() {
        if (isRunning && currentReject) {
          currentReject(new Error('Aborted'));
          currentReject = null;
        }
        clearOutput();
        statusDot.className = 'status-dot';
        statusText.textContent = 'Ready';
      });

      examplesSelect.addEventListener('change', function() {
        var key = examplesSelect.value;
        if (key && EXAMPLES[key]) {
          editor.setValue(EXAMPLES[key]);
          editor.focus();
          clearOutput();
          statusDot.className = 'status-dot';
          statusText.textContent = 'Ready';
        }
        examplesSelect.selectedIndex = 0;
      });

      // ── Resizer ──
      (function() {
        const resizerEl = document.getElementById('resizer');
        const editorPane = document.querySelector('.editor-pane');
        const outputPane = document.getElementById('outputPane');
        let startX, startEditorWidth;

        resizerEl.addEventListener('mousedown', function(e) {
          startX = e.clientX;
          startEditorWidth = editorPane.getBoundingClientRect().width;
          resizerEl.classList.add('active');
          document.body.style.cursor = 'col-resize';
          document.body.style.userSelect = 'none';

          function onMove(e) {
            const dx = e.clientX - startX;
            const mainWidth = editorPane.parentElement.getBoundingClientRect().width;
            const newWidth = Math.max(300, Math.min(mainWidth - 300, startEditorWidth + dx));
            editorPane.style.flex = 'none';
            editorPane.style.width = newWidth + 'px';
            outputPane.style.width = (mainWidth - newWidth - 4) + 'px';
            editor.layout();
          }

          function onUp() {
            resizerEl.classList.remove('active');
            document.body.style.cursor = '';
            document.body.style.userSelect = '';
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup', onUp);
          }

          document.addEventListener('mousemove', onMove);
          document.addEventListener('mouseup', onUp);
        });
      })();

      // ── Handle window resize ──
      window.addEventListener('resize', function () { editor.layout(); });

      // ── Focus editor on load ──
      editor.focus();
    });
  </script>
</body>
</html>
