<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HyperCode IDE</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='50,5 95,50 50,95 5,50' fill='%2358a6ff'/></svg>">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.css">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface-bright: #1c2128;
      --border: #30363d;
      --text: #e6edf3;
      --text-dim: #8b949e;
      --text-dimmer: #484f58;
      --accent: #58a6ff;
      --green: #3fb950;
      --green-dim: #238636;
      --red: #f85149;
      --orange: #d29922;
      --purple: #bc8cff;
      --cyan: #79c0ff;
      --header-h: 52px;
      --footer-h: 30px;
      --pane-header-h: 38px;
      --radius: 6px;
      --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', 'Menlo', 'Consolas', monospace;
      --transition: 150ms ease;
    }

    html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }

    /* ── Header ── */
    header {
      height: var(--header-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; gap: 12px;
    }
    .brand { display: flex; align-items: center; gap: 10px; user-select: none; }
    .brand svg { width: 22px; height: 22px; flex-shrink: 0; }
    .brand-name { font-weight: 700; font-size: 16px; letter-spacing: -0.3px; }
    .brand-badge {
      font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px;
      background: rgba(88,166,255,0.15); color: var(--accent); padding: 2px 7px; border-radius: 4px;
    }
    .controls { display: flex; align-items: center; gap: 8px; }
    select {
      background: var(--surface-bright); color: var(--text); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 7px 14px; font-size: 13px; cursor: pointer; outline: none;
      transition: border-color var(--transition);
    }
    select:hover { border-color: var(--text-dim); }
    select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(88,166,255,0.12); }
    button {
      border: 1px solid transparent; border-radius: var(--radius); padding: 7px 18px;
      font-size: 13px; font-weight: 600; cursor: pointer; transition: all var(--transition);
      display: flex; align-items: center; gap: 6px; font-family: inherit;
    }
    .btn-run { background: var(--green-dim); color: #fff; border-color: rgba(63,185,80,0.4); }
    .btn-run:hover { background: var(--green); }
    .btn-run:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-run:disabled:hover { background: var(--green-dim); }
    .btn-clear { background: transparent; color: var(--text-dim); border-color: var(--border); }
    .btn-clear:hover { color: var(--text); border-color: var(--text-dim); }
    .shortcut-hint {
      font-size: 11px; color: var(--text-dimmer); font-family: var(--font-mono);
      background: var(--surface-bright); padding: 3px 8px; border-radius: 4px;
      border: 1px solid var(--border);
    }

    /* ── Main Layout ── */
    main {
      display: flex;
      height: calc(100% - var(--header-h) - var(--footer-h));
    }
    .pane { display: flex; flex-direction: column; overflow: hidden; }
    .editor-pane { flex: 1; min-width: 0; border-right: 1px solid var(--border); }
    .output-pane { width: 40%; min-width: 280px; }
    .pane-header {
      height: var(--pane-header-h);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px;
      font-size: 11px; font-weight: 600; color: var(--text-dim);
      text-transform: uppercase; letter-spacing: 0.8px;
      background: var(--surface); border-bottom: 1px solid var(--border); user-select: none;
    }
    .pane-header .file-ext { color: var(--text-dimmer); font-weight: 400; }

    /* ── CodeMirror Theme ── */
    .editor-wrap { flex: 1; overflow: hidden; }
    .CodeMirror {
      height: 100% !important;
      font-family: var(--font-mono) !important;
      font-size: 14px; line-height: 1.65;
    }
    .cm-s-say.CodeMirror { background: var(--bg); color: var(--text); }
    .cm-s-say .CodeMirror-gutters { background: var(--bg); border-right: 1px solid var(--border); }
    .cm-s-say .CodeMirror-linenumber { color: var(--text-dimmer); padding: 0 12px 0 8px; }
    .cm-s-say .CodeMirror-cursor { border-left: 2px solid var(--accent); }
    .cm-s-say .CodeMirror-selected { background: rgba(88,166,255,0.15) !important; }
    .cm-s-say .CodeMirror-activeline-background { background: rgba(255,255,255,0.03); }
    .cm-s-say .CodeMirror-matchingbracket { color: var(--text) !important; background: rgba(88,166,255,0.25); border-radius: 2px; }
    .cm-s-say .cm-keyword { color: #ff7b72; font-weight: 500; }
    .cm-s-say .cm-atom { color: var(--cyan); }
    .cm-s-say .cm-number { color: var(--purple); }
    .cm-s-say .cm-variable { color: var(--text); }
    .cm-s-say .cm-variable-2 { color: #ffa657; }
    .cm-s-say .cm-comment { color: var(--text-dimmer); font-style: italic; }
    .cm-s-say .cm-operator { color: #ff7b72; }
    .cm-s-say .cm-bracket { color: var(--text-dim); }
    .cm-s-say .cm-def { color: #d2a8ff; }
    .cm-s-say .cm-string { color: #a5d6ff; }
    .cm-s-say .cm-string-2 { color: #a5d6ff; font-style: italic; }
    .cm-s-say .cm-property { color: #ffa657; }
    .cm-s-say .cm-builtin { color: #79c0ff; }
    .cm-s-say .cm-error-line { background: rgba(248,81,73,0.1) !important; }

    /* ── Output ── */
    .output-content {
      flex: 1; overflow-y: auto; padding: 14px 18px;
      font-family: var(--font-mono); font-size: 13px; line-height: 1.75;
    }
    .output-line { white-space: pre-wrap; word-break: break-word; animation: fadeIn 80ms ease; }
    .output-line.error { color: var(--red); }
    .output-line.prompt { color: var(--orange); }
    .output-line.user-input { color: var(--accent); }
    .output-line.success { color: var(--green); }
    .output-line.info { color: var(--text-dim); }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; transform: translateY(0); } }

    .empty-state {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; gap: 12px; color: var(--text-dimmer); user-select: none;
    }
    .empty-state .icon { font-size: 36px; opacity: 0.3; }
    .empty-state p { font-size: 13px; }
    .empty-state .hint { font-size: 11px; opacity: 0.6; }

    .ask-container { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
    .ask-marker { color: var(--accent); font-weight: 700; flex-shrink: 0; }
    .ask-input {
      flex: 1; background: transparent; border: none; border-bottom: 2px solid var(--accent);
      color: var(--text); font-family: var(--font-mono); font-size: 13px;
      padding: 4px 0; outline: none; caret-color: var(--accent);
    }
    .ask-input::placeholder { color: var(--text-dimmer); }

    /* ── Footer ── */
    footer {
      height: var(--footer-h);
      background: var(--surface); border-top: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; font-size: 11px; color: var(--text-dim);
    }
    .status-dot {
      display: inline-block; width: 7px; height: 7px; border-radius: 50%;
      margin-right: 6px; background: var(--green); vertical-align: middle;
    }
    .status-dot.running { background: var(--orange); animation: pulse 1s ease infinite; }
    .status-dot.error { background: var(--red); }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    /* ── Resizer ── */
    .resizer {
      width: 4px; cursor: col-resize; background: transparent;
      transition: background var(--transition); position: relative; z-index: 10; margin: 0 -2px;
    }
    .resizer:hover, .resizer.active { background: var(--accent); }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-dimmer); }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polygon points="50,8 92,50 50,92 8,50" fill="#58a6ff" opacity="0.9"/>
        <polygon points="50,22 78,50 50,78 22,50" fill="#0d1117" opacity="0.6"/>
        <polygon points="50,34 66,50 50,66 34,50" fill="#58a6ff"/>
      </svg>
      <span class="brand-name">HyperCode</span>
      <span class="brand-badge">IDE</span>
    </div>
    <div class="controls">
      <select id="examples">
        <option value="">Load Example...</option>
        <option value="hello">Hello World</option>
        <option value="fizzbuzz">FizzBuzz</option>
        <option value="lists">List Operations</option>
        <option value="classroom">Classroom (OOP)</option>
        <option value="quiz">Quiz Game</option>
      </select>
      <button class="btn-run" id="runBtn" title="Run code">
        <span id="runIcon">&#9654;</span>
        <span id="runLabel">Run</span>
      </button>
      <button class="btn-clear" id="clearBtn" title="Clear output">Clear</button>
      <span class="shortcut-hint" id="shortcutHint"></span>
    </div>
  </header>

  <main>
    <div class="pane editor-pane">
      <div class="pane-header">
        <span>Editor</span>
        <span class="file-ext">.say</span>
      </div>
      <div class="editor-wrap" id="editorWrap"></div>
    </div>
    <div class="resizer" id="resizer"></div>
    <div class="pane output-pane" id="outputPane">
      <div class="pane-header"><span>Output</span></div>
      <div class="output-content" id="output">
        <div class="empty-state" id="emptyState">
          <div class="icon">&#9654;</div>
          <p>Run your code to see output here</p>
          <p class="hint" id="emptyHint"></p>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div>
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Ready</span>
    </div>
    <span id="position">Ln 1, Col 1</span>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/addon/edit/matchbrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/addon/edit/closebrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/addon/selection/active-line.min.js"></script>
  <script src="say.js"></script>
  <script>
    // ── Examples ──
    const EXAMPLES = {
      hello:
`-- Hello World
-- A simple greeting program

put ask What is your name into name
show Hello .name, welcome to HyperCode!`,

      fizzbuzz:
`-- FizzBuzz
-- The classic challenge

for each n in 1 to 30
  if n % 15 == 0
    show FizzBuzz
  else if n % 3 == 0
    show Fizz
  else if n % 5 == 0
    show Buzz
  else
    show .n
  end
end`,

      lists:
`-- List Operations
-- Working with collections

put list 5, 3, 8, 1, 9, 2, 7 into numbers
show Original .numbers

sort numbers
show Sorted .numbers

reverse numbers
show Reversed .numbers

show
show Count (.numbers.count)
show Sum (.numbers.sum)
show Min (.numbers.min)
show Max (.numbers.max)

put numbers where it > 4 into big
show
show Bigger than 4 .big
show That is (.big.count) numbers`,

      classroom:
`-- Classroom
-- Object-oriented programming with Kinds

kind Student
  name is Unknown
  grade is 0

  on passing
    return me.grade >= 70
  end

  on report
    if send passing to me
      show .me.name scored .me.grade and is passing
    else
      show .me.name scored .me.grade and needs help
    end
  end
end

make a Student called alice with name Alice, grade 95
make a Student called bob with name Bob, grade 60
make a Student called charlie with name Charlie, grade 82

put list alice, bob, charlie into students

show Class Report
for each s in students
  send report to s
end

put students where send passing to it into passing
show
show (.passing.count) out of (.students.count) students passing`,

      quiz:
`-- Quiz Game
-- Interactive trivia with score tracking

kind Question
  text is Empty
  answer is Empty

  on check guess
    if guess == me.answer
      show Correct!
      return true
    else
      show Wrong. The answer was .me.answer
      return false
    end
  end
end

put 0 into score
put 0 into total

put list into questions
  make a Question with text What planet is closest to the sun, answer Mercury
  make a Question with text What language is this, answer HyperCode
  make a Question with text How many legs does a spider have, answer 8
end

for each q in questions
  ask .q.text
  put it into guess
  put total + 1 into total
  if send check guess to q
    put score + 1 into score
  end
end

show You got .score out of .total`,
    };

    const DEFAULT_CODE =
`-- Welcome to HyperCode!
-- Select an example above, or write your own

show Hello, World!
`;

    // ── Detect platform ──
    const isMac = navigator.platform.toUpperCase().indexOf('MAC') >= 0;
    document.getElementById('shortcutHint').textContent = isMac ? '\u2318\u21B5' : 'Ctrl+\u21B5';
    document.getElementById('emptyHint').textContent = `Press ${isMac ? '\u2318' : 'Ctrl+'}Enter or click Run`;

    // ── Define CodeMirror mode ──
    CodeMirror.defineMode('say', function() {
      // Core action keywords
      var actions = 'put,into,set,show,ask,make,send,add,remove,go,open,hide,' +
        'draw,wait,play,clear,stop,return,use,grab';
      // Control flow
      var control = 'if,else,repeat,times,while,until,forever,for,each,in,to,at,' +
        'by,as,when,is,try,or,catch,do,together';
      // Definition / structure
      var defs = 'kind,from,on,me,end,command,template,contract,implements,secret,static,' +
        'test,check,mock,before,after,benchmark,snapshot,enum';
      // Articles / connectors
      var connectors = 'a,called,with,it,not,and,greater,less,than,new,where,contains';
      // Collections
      var collections = 'list,map,pair,unique,sort,reverse,shuffle';
      // I/O & system
      var system = 'read,write,append,fetch,serve,respond,route,status,request,' +
        'remember,recall,forget,think,explain,listen,every,second,seconds,' +
        'emit,connect,stream,cookie,allow,env,current,today,arguments,files,folder';
      // Graphics & UI
      var graphics = 'canvas,circle,rectangle,line,color,size,fill,stroke,width,height,' +
        'animate,moving,over,sprite,load,touches,scene,switch,layer,' +
        'forward,backward,turn,left,right,pen,up,down,note,sound';
      // Types
      var types = 'text,number,boolean,date,time';
      // Functional
      var functional = 'apply,curry,compose';
      // Education
      var education = 'classroom,submit,collect,visualize,challenge,grade,rubric';
      // Debug
      var debug = 'debug,step,breakpoint,watch,profile,lint,save,history';

      var allKw = (actions + ',' + control + ',' + defs + ',' + connectors + ',' +
        collections + ',' + system + ',' + graphics + ',' + types + ',' +
        functional + ',' + education + ',' + debug).split(',');
      var kwSet = {};
      for (var i = 0; i < allKw.length; i++) kwSet[allKw[i]] = true;

      var atomSet = { 'true': true, 'false': true, 'nothing': true };
      var typeSet = { 'text': true, 'number': true, 'boolean': true, 'date': true, 'time': true };

      // Keywords that start a text/template line (rest of line is plain text
      // except for .dotInterpolation and (expressions))
      var textLineKw = { 'show': true, 'ask': true };

      return {
        startState: function() { return { inMultiComment: false, inTripleString: false, inTextLine: false, parenDepth: 0 }; },
        token: function(stream, state) {
          // Reset text-line mode at the start of each line
          if (stream.sol()) { state.inTextLine = false; state.parenDepth = 0; }

          // Multi-line comment
          if (state.inMultiComment) {
            if (stream.match('---')) { state.inMultiComment = false; return 'comment'; }
            stream.skipToEnd();
            return 'comment';
          }
          // Triple-quoted string
          if (state.inTripleString) {
            if (stream.match('"""')) { state.inTripleString = false; return 'string'; }
            // Interpolation inside triple string
            if (stream.match(/^\{[^}]*\}/)) return 'string-2';
            stream.next();
            return 'string';
          }
          // Start of triple comment
          if (stream.match('---')) { state.inMultiComment = true; return 'comment'; }
          // Single-line comment
          if (stream.match('--')) { stream.skipToEnd(); return 'comment'; }
          // Whitespace
          if (stream.eatSpace()) return null;
          // Triple-quoted string start
          if (stream.match('"""')) { state.inTripleString = true; return 'string'; }
          // Double-quoted string
          if (stream.peek() === '"') {
            stream.next();
            while (!stream.eol()) {
              var ch = stream.next();
              if (ch === '\\') { stream.next(); continue; }
              if (ch === '{') {
                // Read interpolation
                while (!stream.eol() && stream.peek() !== '}') stream.next();
                if (stream.peek() === '}') stream.next();
                continue;
              }
              if (ch === '"') return 'string';
            }
            return 'string';
          }
          // Dot-interpolation (.varName) — always highlighted, even in text lines
          if (stream.match(/^\.[a-zA-Z_]\w*(\.[a-zA-Z_]\w*)*/)) return 'variable-2';

          // Inside a text-line (show/ask): treat most tokens as plain text
          if (state.inTextLine && state.parenDepth === 0) {
            // Opening paren starts an expression
            if (stream.peek() === '(') {
              stream.next();
              state.parenDepth = 1;
              return 'bracket';
            }
            // Everything else on the line is plain text
            if (stream.match(/^[^\s.(]+/)) return 'variable';
            stream.next();
            return 'variable';
          }

          // Inside parenthesized expression within a text-line — highlight normally
          if (state.inTextLine && state.parenDepth > 0) {
            if (stream.peek() === '(') { stream.next(); state.parenDepth++; return 'bracket'; }
            if (stream.peek() === ')') { stream.next(); state.parenDepth--; return 'bracket'; }
          }

          // Pipeline operator
          if (stream.match('|>') || stream.match('|')) return 'operator';
          // Arrow
          if (stream.match('->')) return 'operator';
          // Numbers
          if (stream.match(/^-?\d+(\.\d+)?/)) return 'number';
          // Identifiers and keywords
          if (stream.match(/^[a-zA-Z_]\w*/)) {
            var w = stream.current().toLowerCase();
            if (atomSet[w]) return 'atom';
            if (typeSet[w]) return 'builtin';
            if (kwSet[w]) {
              // If this keyword starts a text line, flag the state
              if (textLineKw[w]) state.inTextLine = true;
              return 'keyword';
            }
            // Capitalized = type/class name
            var first = stream.current()[0];
            if (first === first.toUpperCase() && first !== first.toLowerCase()) return 'def';
            return 'variable';
          }
          // Operators
          if (stream.match(/^[+\-*\/%\^]/)) return 'operator';
          if (stream.match(/^[><=!]=?/)) return 'operator';
          // Brackets/delimiters
          if (stream.match(/^[(){}\[\],?:]/)) return 'bracket';
          stream.next();
          return null;
        }
      };
    });

    // ── Initialize Editor ──
    const editor = CodeMirror(document.getElementById('editorWrap'), {
      value: DEFAULT_CODE,
      mode: 'say',
      theme: 'say',
      lineNumbers: true,
      matchBrackets: true,
      autoCloseBrackets: true,
      styleActiveLine: true,
      tabSize: 2,
      indentWithTabs: false,
      lineWrapping: false,
      extraKeys: {
        'Cmd-Enter': function() { runCode(); },
        'Ctrl-Enter': function() { runCode(); },
      }
    });

    // ── Cursor position ──
    editor.on('cursorActivity', function() {
      var pos = editor.getCursor();
      document.getElementById('position').textContent = 'Ln ' + (pos.line + 1) + ', Col ' + (pos.ch + 1);
    });

    // ── DOM refs ──
    const outputEl = document.getElementById('output');
    const emptyState = document.getElementById('emptyState');
    const runBtn = document.getElementById('runBtn');
    const runIcon = document.getElementById('runIcon');
    const runLabel = document.getElementById('runLabel');
    const clearBtn = document.getElementById('clearBtn');
    const examplesSelect = document.getElementById('examples');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');

    // ── State ──
    let isRunning = false;
    let currentReject = null;

    // ── Output helpers ──
    function clearOutput() {
      outputEl.innerHTML = '';
      emptyState.style.display = '';
      outputEl.appendChild(emptyState);
    }

    function hideEmpty() {
      if (emptyState.parentNode) emptyState.remove();
    }

    function appendLine(text, cls) {
      hideEmpty();
      const div = document.createElement('div');
      div.className = 'output-line' + (cls ? ' ' + cls : '');
      div.textContent = text;
      outputEl.appendChild(div);
      outputEl.scrollTop = outputEl.scrollHeight;
      return div;
    }

    // ── Run ──
    async function runCode() {
      if (isRunning) return;
      isRunning = true;
      runBtn.disabled = true;
      runIcon.textContent = '\u23F3';
      runLabel.textContent = 'Running';
      statusDot.className = 'status-dot running';
      statusText.textContent = 'Running...';

      // Clear output
      outputEl.innerHTML = '';
      hideEmpty();

      const source = editor.getValue();
      const startTime = performance.now();

      try {
        const { Lexer, Parser, Interpreter } = HyperCode;
        const lexer = new Lexer(source);
        const tokens = lexer.tokenize();
        const parser = new Parser();
        const program = parser.parse(tokens);

        const interpreter = new Interpreter({
          output: function(text) {
            appendLine(text);
          },
          input: function(prompt) {
            return new Promise(function(resolve, reject) {
              currentReject = reject;
              appendLine('? ' + prompt, 'prompt');

              const container = document.createElement('div');
              container.className = 'ask-container';

              const marker = document.createElement('span');
              marker.className = 'ask-marker';
              marker.textContent = '\u276F';

              const input = document.createElement('input');
              input.type = 'text';
              input.className = 'ask-input';
              input.placeholder = 'Type your answer...';
              input.autocomplete = 'off';

              input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                  var val = input.value;
                  container.remove();
                  appendLine('\u276F ' + val, 'user-input');
                  currentReject = null;
                  resolve(val);
                }
              });

              container.appendChild(marker);
              container.appendChild(input);
              outputEl.appendChild(container);
              outputEl.scrollTop = outputEl.scrollHeight;
              input.focus();
            });
          },
          maxIterations: 100000
        });

        await interpreter.run(program);

        const elapsed = ((performance.now() - startTime) / 1000).toFixed(2);
        appendLine('', 'info');
        appendLine('\u2713 Finished in ' + elapsed + 's', 'success');
        statusDot.className = 'status-dot';
        statusText.textContent = 'Done in ' + elapsed + 's';

      } catch (err) {
        if (err && err.message === 'Aborted') {
          appendLine('\u2717 Stopped', 'info');
          statusDot.className = 'status-dot';
          statusText.textContent = 'Stopped';
        } else {
          appendLine('', 'info');
          appendLine('\u2717 Error: ' + (err.message || err), 'error');
          statusDot.className = 'status-dot error';
          statusText.textContent = 'Error';

          // Highlight error line if available
          if (err.line) {
            editor.addLineClass(err.line - 1, 'background', 'cm-error-line');
            setTimeout(function() { editor.removeLineClass(err.line - 1, 'background', 'cm-error-line'); }, 3000);
          }
        }
      }

      isRunning = false;
      currentReject = null;
      runBtn.disabled = false;
      runIcon.textContent = '\u25B6';
      runLabel.textContent = 'Run';
    }

    // ── Event handlers ──
    runBtn.addEventListener('click', runCode);

    clearBtn.addEventListener('click', function() {
      if (isRunning && currentReject) {
        currentReject(new Error('Aborted'));
        currentReject = null;
      }
      clearOutput();
      statusDot.className = 'status-dot';
      statusText.textContent = 'Ready';
    });

    examplesSelect.addEventListener('change', function() {
      var key = examplesSelect.value;
      if (key && EXAMPLES[key]) {
        editor.setValue(EXAMPLES[key]);
        editor.clearHistory();
        editor.focus();
        clearOutput();
        statusDot.className = 'status-dot';
        statusText.textContent = 'Ready';
      }
      examplesSelect.selectedIndex = 0;
    });

    // ── Resizer ──
    (function() {
      const resizer = document.getElementById('resizer');
      const editorPane = document.querySelector('.editor-pane');
      const outputPane = document.getElementById('outputPane');
      let startX, startEditorWidth;

      resizer.addEventListener('mousedown', function(e) {
        startX = e.clientX;
        startEditorWidth = editorPane.getBoundingClientRect().width;
        resizer.classList.add('active');
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';

        function onMove(e) {
          const dx = e.clientX - startX;
          const mainWidth = editorPane.parentElement.getBoundingClientRect().width;
          const newWidth = Math.max(300, Math.min(mainWidth - 300, startEditorWidth + dx));
          editorPane.style.flex = 'none';
          editorPane.style.width = newWidth + 'px';
          outputPane.style.width = (mainWidth - newWidth - 4) + 'px';
          editor.refresh();
        }

        function onUp() {
          resizer.classList.remove('active');
          document.body.style.cursor = '';
          document.body.style.userSelect = '';
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
        }

        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });
    })();

    // ── Focus editor on load ──
    editor.focus();
  </script>
</body>
</html>
